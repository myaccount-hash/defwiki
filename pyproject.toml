[project]
name = "defwiki"
version = "0.1.0"
description = "LLMが作業に用いる概念の定義の体系を保持する MCP サーバ"
readme = "README.md"
license = "MIT"
authors = [{ name = "myaccount-hash" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<3", "jsonschema>=4"]

[project.scripts]
defwiki = "defwiki.server:main"
defwiki-export = "defwiki.export:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defwiki"]

[tool.pytest.ini_options]
pythonpath = ["src"]
